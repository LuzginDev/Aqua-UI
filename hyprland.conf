# =======================================================================================
#  AQUA-SHELL HYPRLAND CONFIG
#  Designed for Quickshell macOS-like environment
# =======================================================================================

# --- MONITOR CONFIGURATION ---
# Automatic monitor configuration.
# addreserved: 32px top (TopBar), 0 bottom, 0 left, 0 right.
monitor = , preferred, auto, 1, addreserved, 32, 0, 0, 0


# --- MY PROGRAMS ---
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun # Fallback menu if Quickshell crashes


# --- AUTOSTART ---
# Start required daemons and interface


# 2. Authentication agent (Polkit) - needed for GUI apps that require a password
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# 3. Start Quickshell (UI)
# Change to project directory so imports work correctly
exec-once = cd ~/aqua-shell && quickshell shell.qml

# 4. Daemons for window overview (Mission Control)
# Create thumbnails when switching windows
exec-once = ~/aqua-shell/scripts/thumb_daemon.sh
# Update background windows
exec-once = ~/aqua-shell/scripts/background_updater.sh


# --- ENVIRONMENT VARIABLES ---
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct 
env = QT_QPA_PLATFORM,wayland


# --- INPUT & KEYBOARD ---
input {
    kb_layout = us,ru,ua
    kb_variant =
    kb_model =
    # We don't use grp:alt_shift_toggle because we switch layouts via a script for OSD
    kb_options = 
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
        clickfinger_behavior = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}


# --- GENERAL APPEARANCE ---
general {
    # Gaps (macOS style)
    gaps_in = 5
    gaps_out = 10

    # Remove borders for a clean style
    border_size = 0
    
    # If you want to restore borders:
    # border_size = 1
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Tearing (usually disabled)
    allow_tearing = false
}


# --- DECORATION (BLUR & SHADOWS) ---
decoration {
    # Corner rounding (should match Metrics.windowRadius in QML)
    rounding = 12

    # Blur settings (Glassmorphism)
    blur {
        enabled = true
        size = 8          # Blur strength
        passes = 3        # Number of passes (3 = high-quality frosted glass)
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.02      # Slight noise for texture
    }

    # Shadows
    drop_shadow = true
    shadow_range = 30
    shadow_render_power = 3
    col.shadow = 0x66000000
}


# --- ANIMATIONS ---
animations {
    enabled = true

    # Bezier curves (macOS-like snappy feel)
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    # Window open/close animations
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, slide
}


# --- LAYOUTS ---
dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    # new_is_master = true (deprecated in new versions, use new_status)
    new_status = master
}


# --- GESTURES ---
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}


# --- LAYER RULES (QUICKSHELL INTEGRATION) ---
# Critically important for blur to work in the menu

# Enable blur for all Quickshell windows
layerrule = blur, namespace:quickshell

# Ignore transparent pixels (so corners stay clean)
layerrule = ignorezero, namespace:quickshell

# If you use Rofi/Wofi as a fallback
layerrule = blur, rofi
layerrule = ignorezero, rofi


# --- WINDOW RULES ---
# Rules for floating windows
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = float,class:^(nm-connection-editor)$
# Disable animation on screenshots (to avoid flicker when updating thumbnails)
windowrulev2 = noanim, title:^(grim)$


# --- KEYBINDINGS ---
$mainMod = SUPER

# 1. Main actions
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# 2. AQUA UI INTEGRATION (IPC)

# App Launcher (Launchpad) -> SUPER + SPACE
# Send command to Quickshell socket
bind = $mainMod, SPACE, exec, echo "launcher:toggle" | socat - UNIX-CONNECT:/tmp/aqua.sock

# Overview (Mission Control) -> SUPER + TAB
bind = $mainMod, Tab, exec, echo "overview:toggle" | socat - UNIX-CONNECT:/tmp/aqua.sock

# Switch layout with OSD -> SUPER + K (or customize)
bind = $mainMod, K, exec, ~/aqua-shell/scripts/keyboard.sh

# 3. MEDIA KEYS (OSD scripts)

# Sound
bindel = , XF86AudioRaiseVolume, exec, ~/aqua-shell/scripts/volume.sh 5%+
bindel = , XF86AudioLowerVolume, exec, ~/aqua-shell/scripts/volume.sh 5%-
bindl  = , XF86AudioMute, exec, ~/aqua-shell/scripts/volume.sh toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, ~/aqua-shell/scripts/brightness.sh 5%+
bindel = , XF86MonBrightnessDown, exec, ~/aqua-shell/scripts/brightness.sh 5%-

# Player controls (standard)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# 4. Focus control (arrows)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# 5. Switch workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# 6. Move windows between workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# 7. Scroll workspaces with mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# 8. Move/Resize windows with mouse (LMB/RMB)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow